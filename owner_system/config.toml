# Robinhood Chain — verified chain facts
# FASE 0 output. Semua address di file ini DIVERIFIKASI on-chain pada tanggal tercantum.
# Aturan: jangan tambah address ke file ini tanpa kolom `source` + `verified`.

[chain]
name        = "Robinhood Chain"
chain_id    = 4663                     # eth_chainId -> 0x1237
stack       = "Arbitrum Nitro (Orbit)" # web3_clientVersion -> nitro/v3.11.4-rc.3-7d5ac27
settles_to  = "Ethereum L1"            # genesis/blocks carry l1BlockNumber ~25.9M
gas_token   = "ETH"
genesis_block   = 0                    # timestamp 0 (placeholder genesis)
first_live_block = 1
first_live_ts   = 1777567931           # 2026-04-30T16:52:11Z
age_days_at_survey = 135
block_time_sec  = 0.10                 # measured: ~9.9 blocks/s over last 13 days
verified    = "2026-09-12"

[rpc]
http = "https://rpc.mainnet.chain.robinhood.com"
ws   = ""                              # TIDAK ADA WS publik: upgrade -> 400 / /ws -> 404
archive = false                        # state hanya ~1k-10k blok terakhir ("metadata is not found")
getlogs_max_results = 10000            # error: "logs matched by query exceeds limit of 10000"
getlogs_max_block_range = 0            # tidak ada limit range, yang membatasi adalah jumlah log
latency_trivial_sec = "0.55-2.3"
latency_getlogs_1000blk_sec = 11.0
dns_note = "Host di-DNS-hijack oleh ISP (resolve ke aduankonten.id / 36.86.63.185). WAJIB pakai DoH: curl --doh-url https://cloudflare-dns.com/dns-query. Real CNAME -> customer-origin.offchainlabs.com"
verified = "2026-09-12"

[explorer]
blockscout_ui  = "https://robinhoodchain.blockscout.com"
blockscout_api = ""                    # API di balik Cloudflare challenge, tidak bisa diakses programatik
verified = "2026-09-12"

[bitquery]
endpoint = "https://streaming.bitquery.io/graphql"
network  = "robinhood"
datasets_confirmed = ["Blocks", "DEXTrades", "Events", "Transfers"]
# Events   : ABI ter-decode penuh (Initialize args lengkap) + Transaction.From = deployer asli
# Transfers: Amount sudah ter-scale desimal + Currency.Decimals + Transaction.From
# DECODE GOTCHA: arg bytes32 (PoolId) WAJIB minta fragment "... on EVM_ABI_Bytes_Value_Arg{ hex }",
#               kalau tidak Value balik kosong.
realtime_lag = "none (block 61,112,596 @ 12:39:08Z saat chain di 61,113,047)"
auth = "Bearer <ory_at_...> — simpan di env BITQUERY_TOKEN, JANGAN commit"
verified = "2026-09-12"

# ─────────────────────────────────────────────────────────────
# DEX — target utama
# ─────────────────────────────────────────────────────────────
[dex.uniswap_v4]
pool_manager = "0x8366a39cc670b4001a1121b8f6a443a643e40951"
# Verifikasi 3 jalur independen:
#  1. keccak256 event-sig match: Swap(bytes32,address,int128,int128,uint160,uint128,int24,uint24)
#     = 0x40e9cecb... ; ModifyLiquidity(bytes32,address,int24,int24,int256,bytes32) = 0xf208f491...
#     ; Initialize(bytes32,address,address,uint24,int24,address,uint160,int24) = 0xdd466e67...
#     Ketiganya dipancarkan HANYA oleh address ini (pola singleton).
#  2. Bitquery DEXTrades: ProtocolName="uniswap_v4", SmartContract = address yang sama.
#  3. eth_getCode = 24009 byte; merespon owner(), protocolFeeController(), protocolFeesAccrued(address).
owner                  = "0x2bad8182c09f50c8318d769245bea52c32be46cd"
protocol_fee_controller = "0x6d0009504d129cf5002dba61d9ae8575aa79314c"
topic_initialize       = "0xdd466e674ea557f56295e2d0218a125ea4b4f0f6f3307b95f85e6110838d6438"
topic_swap             = "0x40e9cecb9f5f1f1c5b9c97dec2917b7ee92e57ba5563708daca94dd84ad7112f"
topic_modify_liquidity = "0xf208f4912782fd25c7f114ca3723a2d5dd6f3bcc3ac8db5af63baa85f711d5ec"
logs_per_block         = 5.15          # -> chunk aman 1500 blok (< 10k log cap)
verified = "2026-09-12"

# CATATAN: signature Initialize di brief kamu (6 param) adalah draft v4 LAMA dan TIDAK match.
# Yang benar di chain ini 8 param (tambah sqrtPriceX96, tick). Sudah dikoreksi di atas.

[dex.uniswap_v3]
factory = "0x1f7d7550B1b028f7571E69A784071F0205FD2EfA"
# Verifikasi: 10 dari 12 pool sampel (yang memancarkan v3 Swap topic
# 0xc42079f94a6350d7e6235f29174924f928cc2ac818eb64fed8004e115fbcca67)
# mengembalikan address ini dari factory(). eth_getCode = 24535 byte.
# 2 factory minor lain terlihat: 0x1ac9dB4a2608ba45D6127B1737949b51Bb54B7F3 (4917 B),
# 0x16494A80E08Bcb9285D87b67149d7b01774D82F8 (2210 B) — belum diidentifikasi.
verified = "2026-09-12"

